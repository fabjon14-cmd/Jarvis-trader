name: Crypto Scalper Backtest

# On-demand only — not scheduled. Replays the live signal/exit logic
# bar-by-bar over historical data to check whether the strategy has any
# edge before trusting further forward-testing. See
# crypto-scalper/scripts/backtest.py and crypto-scalper/CLAUDE.md
# "Backtesting" for what this does and doesn't model.
on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of historical 5-minute bars to test"
        required: false
        default: "60"
      detail_pair:
        description: "Optional: pair to show full trade-by-trade detail for (e.g. AVAX/USD), instead of the aggregate report"
        required: false
        default: ""
      exclude_pairs:
        description: "Optional: comma-separated pairs to exclude from the aggregate report (e.g. AVAX/USD) — does not touch the live watchlist"
        required: false
        default: ""
      end_days_ago:
        description: "Shift the window backward by this many days (e.g. 60 = test the 60 days ending 60 days ago, for out-of-sample validation against a period not used to tune the strategy)"
        required: false
        default: "0"
      atr_stop_multiplier:
        description: "Override CRYPTO_ATR_STOP_MULTIPLIER for this run only, for calibration — does not change the live/default value"
        required: false
        default: ""
      atr_tp_multiplier:
        description: "Override CRYPTO_ATR_TP_MULTIPLIER for this run only, for calibration — does not change the live/default value"
        required: false
        default: ""
      use_regime_filter:
        description: "Set to 'regime' to gate all entries on BTC's own daily EMA20/50 trend"
        required: false
        default: ""
      strategy:
        description: "Set to 'trend' to run the experimental trend-following variant instead of the default mean-reversion one"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run backtest
        env:
          CRYPTO_APCA_API_KEY_ID: ${{ secrets.CRYPTO_APCA_API_KEY_ID }}
          CRYPTO_APCA_API_SECRET_KEY: ${{ secrets.CRYPTO_APCA_API_SECRET_KEY }}
          CRYPTO_APCA_BASE_URL: ${{ secrets.CRYPTO_APCA_BASE_URL }}
          CRYPTO_ATR_STOP_MULTIPLIER: ${{ github.event.inputs.atr_stop_multiplier }}
          CRYPTO_ATR_TP_MULTIPLIER: ${{ github.event.inputs.atr_tp_multiplier }}
        run: |
          if [ -n "${{ github.event.inputs.detail_pair }}" ]; then
            python3 crypto-scalper/scripts/backtest.py detail "${{ github.event.inputs.detail_pair }}" "${{ github.event.inputs.lookback_days || 60 }}"
          elif [ "${{ github.event.inputs.strategy }}" = "trend" ]; then
            python3 crypto-scalper/scripts/backtest.py trend "${{ github.event.inputs.lookback_days || 60 }}" "${{ github.event.inputs.end_days_ago || 0 }}"
          else
            python3 crypto-scalper/scripts/backtest.py "${{ github.event.inputs.lookback_days || 60 }}" "${{ github.event.inputs.exclude_pairs }}" "${{ github.event.inputs.end_days_ago || 0 }}" "${{ github.event.inputs.use_regime_filter }}"
          fi
