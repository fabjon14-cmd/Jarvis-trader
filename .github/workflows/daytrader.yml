name: Day Trader

# ENABLED 2026-08-07 on the operator's explicit instruction, after the
# strategy was backtested (5/6 windows profitable, +3.47%/window average,
# beating SPY over the same 6 windows — see daytrader/CLAUDE.md's top
# banner for the full result and its caveats before assuming this is a
# long track record rather than one honest first test).
#
# No `schedule:` trigger (removed 2026-08-07) — GitHub's own cron dispatch
# proved unreliable even beyond the runner-queueing problem below: it went
# 35+ minutes without firing at all during market hours, with the
# self-hosted runner sitting idle and ready. Firing is now driven by a
# local launchd timer on the operator's Mac
# (~/Library/LaunchAgents/com.jarvis-trader.daytrader-trigger.plist, every
# 5 minutes, 24/7) that calls `gh workflow run daytrader.yml` — an OS-level
# timer doesn't have GitHub's schedule-dispatch reliability problem. It
# fires continuously, not just during market hours; the agent's own
# market-clock check (see below) is what actually gates whether anything
# happens, same as before. See daytrader/CLAUDE.md "Local launchd trigger".
#
# Runs on a self-hosted runner (added 2026-08-07) instead of GitHub's
# hosted ubuntu-latest pool — jobs now start in seconds once dispatched
# instead of queueing 15+ minutes under load (same issue already seen
# with the crypto scalper's cron). See daytrader/CLAUDE.md "Self-hosted
# runner". This fixed execution delay, not trigger reliability — hence
# the local launchd timer above for the trigger itself.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daytrader
  cancel-in-progress: false

jobs:
  run-daytrader:
    runs-on: [self-hosted, macOS, trading-bots]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -q requests python-dotenv

      - name: Run daytrader agent
        env:
          # Shares the crypto scalper's Alpaca account (operator's choice,
          # 2026-08-07) — no separate DAYTRADER_APCA_* secrets exist.
          # research.py/trade.py filter all order-history reads to this
          # agent's own watchlist so crypto scalper's orders never count
          # against daytrader's caps. See daytrader/CLAUDE.md.
          DAYTRADER_APCA_API_KEY_ID: ${{ secrets.CRYPTO_APCA_API_KEY_ID }}
          DAYTRADER_APCA_API_SECRET_KEY: ${{ secrets.CRYPTO_APCA_API_SECRET_KEY }}
          DAYTRADER_APCA_BASE_URL: ${{ secrets.CRYPTO_APCA_BASE_URL }}
          DAYTRADER_UNATTENDED: "1"
        run: python3 daytrader/agent/daytrader_agent.py

      - name: Commit journal update
        # Retries push-with-rebase on a non-fast-forward rejection — found
        # 2026-08-07 when two runs landed 16 seconds apart (now common
        # with the self-hosted runner's fast, reliable start time) and the
        # second one's plain `git push` was rejected because the first
        # one's commit had already moved `main` forward. crypto-scalper.yml
        # pushes to the same branch on its own independent schedule too,
        # so this can also happen across workflows, not just within one.
        run: |
          git config user.name "daytrader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add daytrader/journal/
          if git diff --staged --quiet; then
            echo "No journal changes to commit."
          else
            git commit -m "Day trader run $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $i/5) — rebasing onto latest origin/main and retrying."
              git pull --rebase origin main
              sleep $((RANDOM % 5 + 1))
            done
          fi
