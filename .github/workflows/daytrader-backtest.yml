name: Day Trader Backtest

# On-demand only — not scheduled. Replays the live signal/exit logic
# bar-by-bar over historical 5-minute equity bars, before this strategy is
# trusted with even paper money. See daytrader/scripts/backtest.py and
# daytrader/CLAUDE.md "Backtesting" for what this does and doesn't model.
on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of historical 5-minute bars to test"
        required: false
        default: "30"
      end_days_ago:
        description: "Shift the window backward by this many days (out-of-sample validation)"
        required: false
        default: "0"
      detail_symbol:
        description: "Optional: symbol to show full trade-by-trade detail for, instead of the aggregate report"
        required: false
        default: ""
      benchmark:
        description: "Set to 'spy' to report SPY buy-and-hold percent change over the window instead of running the strategy"
        required: false
        default: ""
      atr_check:
        description: "Set to 'true' to report current ATR-based position sizing for every watchlist symbol instead of running the strategy"
        required: false
        default: ""

# Runs on the same self-hosted runner as daytrader.yml (added 2026-08-07)
# — GitHub's hosted pool queued this workflow for 15+ minutes multiple
# times during today's backtesting. See daytrader/CLAUDE.md "Self-hosted
# runner".
jobs:
  backtest:
    runs-on: [self-hosted, macOS, trading-bots]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install --break-system-packages -q requests python-dotenv

      - name: Run backtest
        env:
          # Shares the crypto scalper's account — see daytrader.yml and
          # daytrader/CLAUDE.md "Sharing the crypto scalper's Alpaca
          # account". Market-data reads here don't touch order history at
          # all, so no symbol filtering is needed for this workflow.
          DAYTRADER_APCA_API_KEY_ID: ${{ secrets.CRYPTO_APCA_API_KEY_ID }}
          DAYTRADER_APCA_API_SECRET_KEY: ${{ secrets.CRYPTO_APCA_API_SECRET_KEY }}
          DAYTRADER_APCA_BASE_URL: ${{ secrets.CRYPTO_APCA_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.detail_symbol }}" ]; then
            python3 daytrader/scripts/backtest.py detail "${{ github.event.inputs.detail_symbol }}" "${{ github.event.inputs.lookback_days || 30 }}"
          elif [ "${{ github.event.inputs.atr_check }}" = "true" ]; then
            python3 daytrader/scripts/backtest.py atr-check
          elif [ "${{ github.event.inputs.benchmark }}" = "spy" ]; then
            python3 daytrader/scripts/backtest.py benchmark "${{ github.event.inputs.lookback_days || 30 }}" "${{ github.event.inputs.end_days_ago || 0 }}"
          else
            python3 daytrader/scripts/backtest.py "${{ github.event.inputs.lookback_days || 30 }}" "${{ github.event.inputs.end_days_ago || 0 }}"
          fi
